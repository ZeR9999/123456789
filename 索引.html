<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>羊了个羊 - 三消小游戏</title>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #98fb98 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    user-select: none;
  }
  h1 { color: #2c5f2d; font-size: 22px; margin: 8px 0 4px; text-shadow: 1px 1px 2px rgba(255,255,255,.6); }
  .info { display: flex; gap: 16px; margin-bottom: 8px; font-size: 14px; color: #333; }
  .info span { background: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 12px; }

  #board {
    position: relative;
    width: 340px;
    height: 380px;
    background: rgba(255,255,255,.25);
    border-radius: 16px;
    overflow: hidden;
  }
  .tile {
    position: absolute;
    width: 44px;
    height: 44px;
    background: #fff;
    border: 2px solid #d4a373;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
    transition: transform .12s, opacity .2s;
  }
  .tile:active { transform: scale(.92); }
  .tile.locked { filter: brightness(.55) saturate(.6); cursor: not-allowed; }
  .tile.removing { transform: scale(0); opacity: 0; }

  #slot {
    margin-top: 14px;
    width: 340px;
    height: 56px;
    background: rgba(255,255,255,.5);
    border: 2px dashed #8b5a2b;
    border-radius: 12px;
    display: flex;
    align-items: center;
    padding: 4px;
    gap: 4px;
  }
  .slot-item {
    width: 44px; height: 44px;
    background: #fff;
    border: 2px solid #d4a373;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    animation: pop .2s ease;
  }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }

  .controls { margin-top: 14px; display: flex; gap: 10px; }
  button {
    padding: 8px 18px;
    font-size: 15px;
    border: none;
    border-radius: 20px;
    background: #2c5f2d;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  button:active { transform: translateY(1px); }
  button.secondary { background: #8b5a2b; }

  #mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 99;
  }
  #mask .box {
    background: #fff; border-radius: 16px;
    padding: 28px 36px; text-align: center;
    min-width: 240px;
  }
  #mask h2 { margin-bottom: 12px; color: #2c5f2d; }
  #mask p { margin-bottom: 18px; color: #555; }
</style>
</head>
<body>
  <h1>🐑 羊了个羊</h1>
  <div class="info">
    <span>关卡：<b id="level">1</b></span>
    <span>剩余：<b id="remain">0</b></span>
    <span>已被玩：<b id="busuanzi_value_site_pv">0</b>次</span>
  </div>

  <div id="board"></div>
  <div id="slot"></div>

  <div class="controls">
    <button onclick="restart()">🔄 重新开始</button>
    <button class="secondary" onclick="shuffleSlot()">🔀 洗牌(3次)</button>
  </div>

  <div id="mask">
    <div class="box">
      <h2 id="maskTitle">游戏结束</h2>
      <p id="maskMsg"></p>
      <button onclick="restart()">再来一局</button>
    </div>
  </div>

<script>
/* ===== 游戏配置 ===== */
const EMOJIS = ['🐑','🍎','🍊','🍇','🍉','🍓','🥕','🌽','🍄','🌸'];
const SLOT_MAX = 7;          // 槽位上限
const TILE_W = 44, TILE_H = 44;

let tiles = [];               // 所有方块 {id,emoji,x,y,layer,el,removed}
let slot = [];                // 槽位中的 emoji
let level = 1;
let shuffleLeft = 3;

const boardEl = document.getElementById('board');
const slotEl  = document.getElementById('slot');

/* ===== 生成关卡 ===== */
function genLevel(lv) {
  tiles = []; slot = []; shuffleLeft = 3;
  boardEl.innerHTML = ''; slotEl.innerHTML = '';

  // 种类随关卡增加，但保证每种数量是 3 的倍数
  const kindCount = Math.min(4 + lv, EMOJIS.length);
  const kinds = EMOJIS.slice(0, kindCount);
  // 每种 6 个 = 可消除两组；总数 = kindCount*6
  const pool = [];
  kinds.forEach(k => { for (let i=0;i<6;i++) pool.push(k); });
  // 打乱
  pool.sort(() => Math.random() - .5);

  const layers = Math.min(2 + Math.floor(lv/2), 5); // 层数
  let idx = 0;
  for (let L = 0; L < layers; L++) {
    // 每层随机放若干块，位置错开形成遮挡
    const count = Math.ceil(pool.length / layers) + (L === layers-1 ? pool.length % layers : 0);
    for (let i = 0; i < count && idx < pool.length; i++, idx++) {
      const x = 20 + Math.random() * (340 - 44 - 40);
      const y = 20 + Math.random() * (380 - 44 - 40);
      addTile(pool[idx], x, y, L);
    }
  }
  updateRemain();
  refreshLock();
}

function addTile(emoji, x, y, layer) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.zIndex = layer * 10;
  el.textContent = emoji;
  const t = { id: tiles.length, emoji, x, y, layer, el, removed: false };
  el.onclick = () => onTileClick(t);
  boardEl.appendChild(el);
  tiles.push(t);
}

/* ===== 遮挡判断：是否被更高层方块压住 ===== */
function isLocked(t) {
  return tiles.some(o =>
    !o.removed && o.layer > t.layer &&
    Math.abs(o.x - t.x) < TILE_W * 0.8 &&
    Math.abs(o.y - t.y) < TILE_H * 0.8
  );
}
function refreshLock() {
  tiles.forEach(t => {
    if (t.removed) return;
    t.el.classList.toggle('locked', isLocked(t));
  });
}

/* ===== 点击方块 ===== */
function onTileClick(t) {
  if (t.removed || isLocked(t)) return;
  if (slot.length >= SLOT_MAX) return;

  t.removed = true;
  t.el.classList.add('removing');
  setTimeout(() => t.el.remove(), 200);

  slot.push(t.emoji);
  renderSlot();
  refreshLock();
  updateRemain();

  // 检查三消
  setTimeout(checkMatch, 150);
}

/* ===== 渲染槽位 ===== */
function renderSlot() {
  slotEl.innerHTML = '';
  // 同 emoji 聚在一起显示，更直观
  const sorted = [...slot].sort();
  sorted.forEach(e => {
    const d = document.createElement('div');
    d.className = 'slot-item';
    d.textContent = e;
    slotEl.appendChild(d);
  });
}

/* ===== 三消检测 ===== */
function checkMatch() {
  const count = {};
  slot.forEach(e => count[e] = (count[e]||0)+1);
  let matched = false;
  for (const e in count) {
    while (count[e] >= 3) {
      // 移除槽中 3 个该 emoji
      let n = 3;
      slot = slot.filter(x => { if (n>0 && x===e){n--;return false;} return true; });
      count[e] -= 3;
      matched = true;
    }
  }
  if (matched) {
    renderSlot();
    // 胜利判断
    if (tiles.every(t => t.removed) && slot.length === 0) {
      setTimeout(win, 300);
      return;
    }
  }
  // 失败判断
  if (slot.length >= SLOT_MAX) {
    setTimeout(lose, 300);
  }
}

/* ===== 道具：洗牌（打乱场上未消除方块的位置和层级） ===== */
function shuffleSlot() {
  if (shuffleLeft <= 0) { alert('洗牌次数用完了！'); return; }
  shuffleLeft--;
  const alive = tiles.filter(t => !t.removed);
  const emojis = alive.map(t => t.emoji);
  emojis.sort(() => Math.random() - .5);
  alive.forEach((t, i) => {
    t.emoji = emojis[i];
    t.el.textContent = emojis[i];
    t.x = 20 + Math.random() * (340 - 44 - 40);
    t.y = 20 + Math.random() * (380 - 44 - 40);
    t.el.style.left = t.x + 'px';
    t.el.style.top  = t.y + 'px';
  });
  refreshLock();
}

/* ===== 状态 ===== */
function updateRemain() {
  document.getElementById('remain').textContent = tiles.filter(t=>!t.removed).length;
  document.getElementById('level').textContent = level;
}
function win() {
  showMask('🎉 过关！', `第 ${level} 关完成，进入下一关！`);
  level++;
  setTimeout(genLevel, 50, level);
  setTimeout(hideMask, 1200);
}
function lose() {
  showMask('😵 游戏结束', '槽位满了，再试一次吧！');
}
function showMask(t, m) {
  document.getElementById('maskTitle').textContent = t;
  document.getElementById('maskMsg').textContent = m;
  document.getElementById('mask').style.display = 'flex';
}
function hideMask() { document.getElementById('mask').style.display = 'none'; }
function restart() { level = 1; hideMask(); genLevel(level); }

/* ===== 启动 ===== */
genLevel(level);
</script>
</body>
</html>
